name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Lint, typecheck, tests (with the flux and kubeconform the image ships)
        run: docker build --target test .

  # A tag v1.2.3 publishes ghcr.io/boreddevops/flux-preflight:1.2.3 and :1, which CI jobs pin.
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build and push
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/flux-preflight"
          echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker buildx build --platform linux/amd64,linux/arm64 --provenance=false \
            -t "$image:$version" -t "$image:${version%%.*}" --push .
      # GHCR starts every new package private, whatever the repository is. Fails on the first
      # release until someone makes it public once; see "Releases" in the README.
      - name: Anyone can pull it, without logging in
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/flux-preflight:${GITHUB_REF_NAME#v}"
          docker logout ghcr.io
          for platform in linux/amd64 linux/arm64; do
            if ! docker pull --platform "$platform" "$image"; then
              echo "::error::$image is not public: make the package public, then re-run this job."
              exit 1
            fi
            docker run --rm --platform "$platform" "$image" sh -c \
              'flux-preflight --help >/dev/null && flux version --client && kubeconform -v && yamllint --version'
          done
